<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RQ6 塌陷角二分類多數決結果</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #ffffff;
    color: #000;
    font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: min(94vw, 1000px); padding: 28px 36px; box-sizing: border-box; }
  h1 { font-size: clamp(22px, 2.8vw, 32px); margin: 0 0 16px; text-align: center; font-weight: 700; }
  svg { width: 100%; height: auto; display: block; }
  .axis { font-size: 20px; fill: #000; }
  .axis-title { font-size: 23px; fill: #000; }
  .val  { font-size: 21px; fill: #000; font-weight: 700; }
  .leg  { font-size: 21px; fill: #000; }
  .grid { stroke: #d9d9d9; stroke-width: 1; stroke-dasharray: 3 3; }
  .frame { stroke: #000; stroke-width: 1.2; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hard Voting Results for AC Binary Classification</h1>
    <svg id="chart" viewBox="0 0 960 470" role="img" aria-label="Voting comparison"></svg>
  </div>

<script>
const groups = ["1", "3", "5", "7"];           // number of candidate outputs
const metrics = [
  { key: "Accuracy",    color: "#1f3b5c" },
  { key: "Sensitivity", color: "#5b7fa6" },
  { key: "Specificity", color: "#a9c0d8" },
];
const vals = {                                  // [acc, sens, spec] per group
  "1": [0.919, 0.800, 0.956],
  "3": [0.903, 0.800, 0.933],
  "5": [0.919, 0.800, 0.956],
  "7": [0.903, 0.800, 0.933],
};

const W = 960, H = 470;
const m = { top: 56, right: 24, bottom: 56, left: 58 };
const plotW = W - m.left - m.right;
const plotH = H - m.top - m.bottom;
const yMax = 1.0;
const y = v => m.top + plotH * (1 - v / yMax);

const svg = document.getElementById("chart");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, text) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  svg.appendChild(n);
  return n;
};

// y gridlines + ticks
for (let v = 0; v <= yMax + 1e-9; v += 0.2) {
  el("line", { class: "grid", x1: m.left, y1: y(v), x2: m.left + plotW, y2: y(v) });
  el("line", { class: "frame", x1: m.left - 6, y1: y(v), x2: m.left, y2: y(v) });
  el("text", { class: "axis", x: m.left - 12, y: y(v) + 5, "text-anchor": "end" }, v.toFixed(1));
}
// axes
el("line", { class: "frame", x1: m.left, y1: m.top, x2: m.left, y2: m.top + plotH });
el("line", { class: "frame", x1: m.left, y1: m.top + plotH, x2: m.left + plotW, y2: m.top + plotH });
el("text", { class: "axis-title", x: m.left + plotW / 2, y: H - 8, "text-anchor": "middle" }, "Number of models");

// bars
const gw = plotW / groups.length;
const barW = gw * 0.20;
const innerGap = gw * 0.04;
const groupBarsW = metrics.length * barW + (metrics.length - 1) * innerGap;
groups.forEach((g, gi) => {
  const gx = m.left + gw * gi + (gw - groupBarsW) / 2;
  vals[g].forEach((v, mi) => {
    const bx = gx + mi * (barW + innerGap);
    el("rect", { x: bx, y: y(v), width: barW, height: y(0) - y(v), fill: metrics[mi].color });
    if (mi === 0)
      el("text", { class: "val", x: bx + barW / 2, y: y(v) - 8, "text-anchor": "middle" }, v.toFixed(3));
  });
  // group label
  el("text", { class: "axis", x: m.left + gw * gi + gw / 2, y: m.top + plotH + 24, "text-anchor": "middle" }, g);
});

// legend (top, centered)
const legY = 30;
const items = metrics.map(mt => mt.key);
const itemW = 190;
const totalW = items.length * itemW;
let lx = m.left + (plotW - totalW) / 2;
metrics.forEach(mt => {
  el("rect", { x: lx, y: legY - 13, width: 18, height: 18, fill: mt.color });
  el("text", { class: "leg", x: lx + 26, y: legY + 2 }, mt.key);
  lx += itemW;
});
</script>
</body>
</html>
