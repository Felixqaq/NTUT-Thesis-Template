<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RQ4 AC Three-Class Classification</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #ffffff; color: #000;
    font-family: "Times New Roman", "PingFang TC", "Microsoft JhengHei", serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: min(94vw, 1000px); padding: 28px 36px; box-sizing: border-box; }
  h1 { font-size: clamp(22px, 2.8vw, 32px); margin: 0 0 14px; text-align: center; font-weight: 700; }
  svg { width: 100%; height: auto; display: block; }
  .axis { font-size: 20px; fill: #000; }
  .axis-title { font-size: 23px; fill: #000; }
  .val  { font-size: 19px; fill: #000; font-weight: 700; }
  .leg  { font-size: 20px; fill: #000; }
  .grid { stroke: #d9d9d9; stroke-width: 1; stroke-dasharray: 3 3; }
  .frame { stroke: #000; stroke-width: 1.2; }
</style>
</head>
<body>
  <div class="card">
    <h1>RQ4　AC Three-Class Classification</h1>
    <svg id="chart" viewBox="0 0 960 480" role="img" aria-label="RQ4 AC three-class"></svg>
  </div>

<script>
const groups = ["Accuracy", "Macro-F1", "Balanced Acc."];
const series = [
  { name: "TAP-CT late fusion",     color: "#1f3b5c" },
  { name: "Hybrid Mamba-Attention", color: "#7f9fc0" },
];
const vals = {                       // [TAP-CT, Hybrid] per metric
  "Accuracy":       [0.8044, 0.7593],
  "Macro-F1":       [0.5294, 0.5713],
  "Balanced Acc.":  [0.5341, 0.6319],
};

const W = 960, H = 480;
const m = { top: 62, right: 24, bottom: 52, left: 58 };
const plotW = W - m.left - m.right, plotH = H - m.top - m.bottom;
const yMax = 1.0, y = v => m.top + plotH * (1 - v / yMax);

const svg = document.getElementById("chart");
const NS = "http://www.w3.org/2000/svg";
const el = (t, a, txt) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; svg.appendChild(n); return n; };

for (let v = 0; v <= yMax + 1e-9; v += 0.2) {
  el("line", { class: "grid", x1: m.left, y1: y(v), x2: m.left + plotW, y2: y(v) });
  el("line", { class: "frame", x1: m.left - 6, y1: y(v), x2: m.left, y2: y(v) });
  el("text", { class: "axis", x: m.left - 12, y: y(v) + 5, "text-anchor": "end" }, v.toFixed(1));
}
el("line", { class: "frame", x1: m.left, y1: m.top, x2: m.left, y2: m.top + plotH });
el("line", { class: "frame", x1: m.left, y1: m.top + plotH, x2: m.left + plotW, y2: m.top + plotH });

const gw = plotW / groups.length, barW = gw * 0.26, gap = gw * 0.05;
const blockW = series.length * barW + (series.length - 1) * gap;
groups.forEach((g, gi) => {
  const gx = m.left + gw * gi + (gw - blockW) / 2;
  vals[g].forEach((v, si) => {
    const bx = gx + si * (barW + gap);
    el("rect", { x: bx, y: y(v), width: barW, height: y(0) - y(v), fill: series[si].color });
    el("text", { class: "val", x: bx + barW / 2, y: y(v) - 8, "text-anchor": "middle" }, v.toFixed(3));
  });
  el("text", { class: "axis-title", x: m.left + gw * gi + gw / 2, y: m.top + plotH + 32, "text-anchor": "middle" }, g);
});

// legend
const legY = 34, itemW = 330;
let lx = m.left + (plotW - series.length * itemW) / 2;
series.forEach(s => {
  el("rect", { x: lx, y: legY - 14, width: 20, height: 20, fill: s.color });
  el("text", { class: "leg", x: lx + 28, y: legY + 3 }, s.name);
  lx += itemW;
});
</script>
</body>
</html>
