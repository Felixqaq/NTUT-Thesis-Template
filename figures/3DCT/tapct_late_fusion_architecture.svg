<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">TAP-CT Late Fusion Architecture</title>
  <desc id="desc">Thesis-ready architecture diagram for TAP-CT late fusion using a trainable Hybrid Mamba-Attention CT branch and a frozen TAP-CT embedding branch.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2c5f93"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5f6875"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 38px "Times New Roman", Times, serif; fill: #172033; }
      .subtitle { font: 400 22px "Times New Roman", Times, serif; fill: #4f5b6b; }
      .section { font: 700 26px "Times New Roman", Times, serif; fill: #172033; }
      .label { font: 700 21px "Times New Roman", Times, serif; fill: #172033; }
      .body { font: 400 18px "Times New Roman", Times, serif; fill: #334155; }
      .small { font: 400 16px "Times New Roman", Times, serif; fill: #4b5563; }
      .dim { font: 600 17px "Times New Roman", Times, serif; fill: #26384f; }
      .tiny { font: 400 15px "Times New Roman", Times, serif; fill: #536174; }
      .panel { fill: #fbfdff; stroke: #c8d4e3; stroke-width: 2; rx: 22; }
      .lane { fill: #ffffff; stroke: #b9c7d8; stroke-width: 2; stroke-dasharray: 10 8; rx: 24; }
      .node { fill: #ffffff; stroke: #9fb2ca; stroke-width: 2; rx: 14; }
      .ct { fill: #eaf4ff; stroke: #477ec1; stroke-width: 2.4; rx: 14; }
      .tap { fill: #e9f7ef; stroke: #3d9a63; stroke-width: 2.4; rx: 14; }
      .fusion { fill: #fff2dc; stroke: #c97d30; stroke-width: 2.4; rx: 14; }
      .note { fill: #f2f6fb; stroke: #d4deea; stroke-width: 1.6; rx: 14; }
      .logit { fill: #ffffff; stroke: #9fb2ca; stroke-width: 1.8; rx: 10; }
      .arrow { fill: none; stroke: #2c5f93; stroke-width: 3; marker-end: url(#arrow-blue); }
      .arrow-gray { fill: none; stroke: #5f6875; stroke-width: 2.7; marker-end: url(#arrow-gray); }
      .thin { fill: none; stroke: #9fb2ca; stroke-width: 1.3; }
      .legend-dot-blue { fill: #2c72b8; }
      .legend-dot-green { fill: #3d9a63; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1000"/>

  <text class="title" x="70" y="72">TAP-CT Late Fusion Architecture</text>
  <text class="subtitle" x="70" y="107">Hybrid Mamba-Attention features are concatenated with frozen TAP-CT patient-level embeddings.</text>

  <g transform="translate(1375 62)">
    <circle class="legend-dot-blue" cx="0" cy="0" r="8"/>
    <text class="small" x="16" y="6">trainable modules</text>
    <circle class="legend-dot-green" cx="176" cy="0" r="8"/>
    <text class="small" x="192" y="6">frozen feature source</text>
  </g>

  <!-- Input -->
  <g transform="translate(70 375)">
    <rect class="panel" x="0" y="0" width="210" height="285"/>
    <text class="section" x="70" y="45">Input</text>
    <g transform="translate(48 68) scale(0.86)">
      <polygon points="0,42 66,10 132,42 66,76" fill="#f7fbff" stroke="#5f7fa5" stroke-width="2.2"/>
      <polygon points="0,42 0,120 66,154 66,76" fill="#dcecff" stroke="#5f7fa5" stroke-width="2.2"/>
      <polygon points="132,42 132,120 66,154 66,76" fill="#c5dcf5" stroke="#5f7fa5" stroke-width="2.2"/>
      <path class="thin" d="M22 52 L88 20 M44 63 L110 31 M66 76 L66 154 M0 81 L66 116 M132 81 L66 116"/>
    </g>
    <text class="label" x="50" y="235">3D CT volume</text>
    <text class="dim" x="23" y="262">B x 1 x 112 x 136 x 112</text>
  </g>

  <!-- CT lane -->
  <rect class="lane" x="330" y="160" width="960" height="325"/>
  <text class="section" x="365" y="203">CT Image Branch</text>
  <text class="body" x="365" y="232">Trainable Hybrid Mamba-Attention encoder</text>

  <g transform="translate(365 285)">
    <rect class="ct" x="0" y="0" width="150" height="110"/>
    <text class="label" x="52" y="34">Stem</text>
    <text class="small" x="32" y="61">Conv3D, GN</text>
    <text class="dim" x="30" y="88">32 x 28 x 34 x 28</text>
  </g>

  <g transform="translate(555 285)">
    <rect class="node" x="0" y="0" width="155" height="110"/>
    <text class="label" x="47" y="32">Stage 1</text>
    <text class="small" x="29" y="58">3 Mamba blocks</text>
    <text class="dim" x="22" y="84">32 x 28 x 34 x 28</text>
  </g>

  <g transform="translate(750 285)">
    <rect class="node" x="0" y="0" width="155" height="110"/>
    <text class="label" x="47" y="32">Stage 2</text>
    <text class="small" x="29" y="58">3 Mamba blocks</text>
    <text class="dim" x="26" y="84">64 x 14 x 17 x 14</text>
  </g>

  <g transform="translate(945 285)">
    <rect class="node" x="0" y="0" width="155" height="110"/>
    <text class="label" x="47" y="32">Stage 3</text>
    <text class="small" x="29" y="58">3 Mamba blocks</text>
    <text class="dim" x="34" y="84">128 x 7 x 9 x 7</text>
  </g>

  <g transform="translate(1135 285)">
    <rect class="ct" x="0" y="0" width="120" height="110"/>
    <text class="label" x="21" y="33">Feature</text>
    <text class="small" x="27" y="60">attention</text>
    <text class="dim" x="32" y="87">352-d</text>
  </g>

  <!-- TAP lane -->
  <rect class="lane" x="330" y="545" width="960" height="255"/>
  <text class="section" x="365" y="588">TAP-CT Branch</text>
  <text class="body" x="365" y="617">Frozen TAP-CT-B representation with trainable projection</text>

  <g transform="translate(385 665)">
    <rect class="tap" x="0" y="0" width="210" height="98"/>
    <text class="label" x="44" y="33">TAP-CT-B 3D</text>
    <text class="small" x="51" y="59">frozen encoder</text>
    <text class="dim" x="78" y="82">2304-d</text>
  </g>

  <g transform="translate(675 665)">
    <rect class="node" x="0" y="0" width="210" height="98"/>
    <text class="label" x="37" y="33">Projection MLP</text>
    <text class="small" x="55" y="59">trainable layer</text>
    <text class="dim" x="62" y="82">2304 -> 128</text>
  </g>

  <g transform="translate(965 665)">
    <rect class="node" x="0" y="0" width="210" height="98"/>
    <text class="label" x="62" y="37">TAP feature</text>
    <text class="dim" x="82" y="70">128-d</text>
  </g>

  <!-- Fusion panel -->
  <g transform="translate(1340 280)">
    <rect class="panel" x="0" y="0" width="390" height="455"/>
    <text class="section" x="54" y="46">Late Fusion Classifier</text>

    <g transform="translate(150 88)">
      <circle cx="45" cy="45" r="42" fill="#fff8ef" stroke="#c97d30" stroke-width="2.5"/>
      <path d="M25 25 L65 65 M65 25 L25 65" stroke="#c97d30" stroke-width="5" stroke-linecap="round"/>
      <text class="small" x="5" y="110">concatenation</text>
    </g>

    <g transform="translate(70 230)">
      <rect class="fusion" x="0" y="0" width="250" height="72"/>
      <text class="label" x="64" y="31">Fusion vector</text>
      <text class="dim" x="54" y="56">352 + 128 = 480-d</text>
    </g>

    <g transform="translate(70 326)">
      <rect class="node" x="0" y="0" width="250" height="56"/>
      <text class="label" x="63" y="25">MLP classifier</text>
      <text class="small" x="52" y="45">hidden 256, dropout 0.3</text>
    </g>

    <text class="small" x="132" y="398">GOLD 2026 logits</text>
    <g transform="translate(78 410)">
      <rect class="logit" x="0" y="0" width="42" height="30"/>
      <text class="small" x="17" y="21">0</text>
      <rect class="logit" x="52" y="0" width="42" height="30"/>
      <text class="small" x="69" y="21">1</text>
      <rect class="logit" x="104" y="0" width="42" height="30"/>
      <text class="small" x="121" y="21">2</text>
      <rect class="logit" x="156" y="0" width="42" height="30"/>
      <text class="small" x="173" y="21">3</text>
      <rect class="logit" x="208" y="0" width="42" height="30"/>
      <text class="small" x="225" y="21">4</text>
    </g>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M280 455 C300 455 304 340 358 340"/>
  <path class="arrow-gray" d="M280 515 C314 515 315 714 378 714"/>

  <path class="arrow" d="M515 340 L547 340"/>
  <path class="arrow" d="M710 340 L742 340"/>
  <path class="arrow" d="M905 340 L937 340"/>
  <path class="arrow" d="M1100 340 L1127 340"/>
  <path class="arrow" d="M1255 340 C1294 340 1298 370 1340 370"/>

  <path class="arrow-gray" d="M595 714 L667 714"/>
  <path class="arrow-gray" d="M885 714 L957 714"/>
  <path class="arrow-gray" d="M1175 714 C1288 714 1288 480 1340 425"/>

  <path class="arrow-gray" d="M1535 455 L1535 502"/>
  <path class="arrow-gray" d="M1535 582 L1535 604"/>
  <path class="arrow-gray" d="M1535 663 L1535 676"/>

  <!-- Summary note -->
  <g transform="translate(120 860)">
    <rect class="note" x="0" y="0" width="1560" height="70"/>
    <text class="body" x="28" y="31">Trainable parameters: full model 1,484,709; CT image encoder 1,028,384; TAP-CT projection branch 299,648; classifier head 156,677.</text>
    <text class="tiny" x="28" y="55">TAP-CT-B weights are frozen; only the projection, CT branch, and late-fusion classifier are optimized for the downstream task.</text>
  </g>
</svg>
