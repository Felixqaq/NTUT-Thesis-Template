<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Mamba-Attention CT Encoder</title>
  <desc id="desc">Thesis-ready diagram of the 3D CT encoder from input volume through stem, three residual Mamba stages, attention pooling, and 352-dimensional CT feature output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2c5f93"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 38px "Times New Roman", Times, serif; fill: #172033; }
      .subtitle { font: 400 22px "Times New Roman", Times, serif; fill: #4f5b6b; }
      .label { font: 700 22px "Times New Roman", Times, serif; fill: #172033; }
      .body { font: 400 18px "Times New Roman", Times, serif; fill: #334155; }
      .small { font: 400 16px "Times New Roman", Times, serif; fill: #4b5563; }
      .dim { font: 600 17px "Times New Roman", Times, serif; fill: #26384f; }
      .panel { fill: #fbfdff; stroke: #c8d4e3; stroke-width: 2; rx: 22; }
      .node { fill: #ffffff; stroke: #9fb2ca; stroke-width: 2; rx: 14; }
      .ct { fill: #eaf4ff; stroke: #477ec1; stroke-width: 2.4; rx: 14; }
      .attention { fill: #fff2dc; stroke: #c97d30; stroke-width: 2.4; rx: 14; }
      .note { fill: #f2f6fb; stroke: #d4deea; stroke-width: 1.6; rx: 14; }
      .arrow { fill: none; stroke: #2c5f93; stroke-width: 3; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #9fb2ca; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="760"/>
  <text class="title" x="70" y="72">Hybrid Mamba-Attention CT Encoder</text>
  <text class="subtitle" x="70" y="107">The CT branch preserves 3D spatial structure while using residual Mamba blocks for volumetric context modeling.</text>

  <!-- Input -->
  <g transform="translate(70 260)">
    <rect class="panel" x="0" y="0" width="210" height="285"/>
    <text class="label" x="43" y="45">3D CT input</text>
    <g transform="translate(48 68) scale(0.86)">
      <polygon points="0,42 66,10 132,42 66,76" fill="#f7fbff" stroke="#5f7fa5" stroke-width="2.2"/>
      <polygon points="0,42 0,120 66,154 66,76" fill="#dcecff" stroke="#5f7fa5" stroke-width="2.2"/>
      <polygon points="132,42 132,120 66,154 66,76" fill="#c5dcf5" stroke="#5f7fa5" stroke-width="2.2"/>
      <path class="thin" d="M22 52 L88 20 M44 63 L110 31 M66 76 L66 154 M0 81 L66 116 M132 81 L66 116"/>
    </g>
    <text class="dim" x="23" y="262">B x 1 x 112 x 136 x 112</text>
  </g>

  <!-- Stem -->
  <g transform="translate(340 252)">
    <rect class="ct" x="0" y="0" width="190" height="266"/>
    <text class="label" x="72" y="42">Stem</text>
    <text class="body" x="42" y="78">Conv3D 7x7x7</text>
    <text class="body" x="66" y="106">stride 4</text>
    <text class="body" x="53" y="134">GroupNorm</text>
    <text class="body" x="75" y="162">GELU</text>
    <rect class="note" x="34" y="193" width="122" height="38"/>
    <text class="dim" x="53" y="218">32 channels</text>
  </g>

  <!-- Stages -->
  <g transform="translate(600 215)">
    <rect class="panel" x="0" y="0" width="230" height="340"/>
    <text class="label" x="76" y="45">Stage 1</text>
    <text class="body" x="54" y="78">Conv3D 32 -> 32</text>
    <text class="body" x="84" y="105">stride 1</text>
    <rect class="ct" x="38" y="142" width="154" height="74"/>
    <text class="body" x="68" y="172">Residual</text>
    <text class="body" x="60" y="197">Mamba x3</text>
    <rect class="note" x="26" y="263" width="178" height="42"/>
    <text class="dim" x="42" y="290">32 x 28 x 34 x 28</text>
  </g>

  <g transform="translate(890 215)">
    <rect class="panel" x="0" y="0" width="230" height="340"/>
    <text class="label" x="76" y="45">Stage 2</text>
    <text class="body" x="54" y="78">Conv3D 32 -> 64</text>
    <text class="body" x="84" y="105">stride 2</text>
    <rect class="ct" x="38" y="142" width="154" height="74"/>
    <text class="body" x="68" y="172">Residual</text>
    <text class="body" x="60" y="197">Mamba x3</text>
    <rect class="note" x="26" y="263" width="178" height="42"/>
    <text class="dim" x="47" y="290">64 x 14 x 17 x 14</text>
  </g>

  <g transform="translate(1180 215)">
    <rect class="panel" x="0" y="0" width="230" height="340"/>
    <text class="label" x="76" y="45">Stage 3</text>
    <text class="body" x="50" y="78">Conv3D 64 -> 128</text>
    <text class="body" x="84" y="105">stride 2</text>
    <rect class="ct" x="38" y="142" width="154" height="74"/>
    <text class="body" x="68" y="172">Residual</text>
    <text class="body" x="60" y="197">Mamba x3</text>
    <rect class="note" x="26" y="263" width="178" height="42"/>
    <text class="dim" x="58" y="290">128 x 7 x 9 x 7</text>
  </g>

  <!-- Attention and output -->
  <g transform="translate(1480 248)">
    <rect class="attention" x="0" y="0" width="210" height="145"/>
    <text class="label" x="45" y="42">Attention</text>
    <text class="body" x="57" y="72">pooling</text>
    <text class="small" x="52" y="101">1 layer, 8 heads</text>
    <text class="small" x="47" y="124">dropout 0.1</text>
  </g>

  <g transform="translate(1480 435)">
    <rect class="ct" x="0" y="0" width="210" height="82"/>
    <text class="label" x="53" y="35">CT feature</text>
    <text class="dim" x="81" y="62">352-d</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M280 385 L332 385"/>
  <path class="arrow" d="M530 385 L592 385"/>
  <path class="arrow" d="M830 385 L882 385"/>
  <path class="arrow" d="M1120 385 L1172 385"/>
  <path class="arrow" d="M1410 345 L1472 345"/>
  <path class="arrow" d="M1585 393 L1585 427"/>

  <g transform="translate(140 642)">
    <rect class="note" x="0" y="0" width="1520" height="64"/>
    <text class="body" x="28" y="28">Encoder summary: a stride-4 3D stem is followed by three stages. Each stage applies Conv3D, GroupNorm, GELU, and three residual Mamba blocks.</text>
    <text class="small" x="28" y="51">The final attention pooling layer converts the 3D feature map into a 352-dimensional patient-level CT representation.</text>
  </g>
</svg>
